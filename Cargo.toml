[workspace]
members = ["hostd", "guestd"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
homepage = ""
repository = ""
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8.9"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "service"] }
jsonwebtoken = "9.3.1"
libc = "0.2.185"
rand = "0.9.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.45"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13.3"